name: Traffic MARL CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest bandit pip-audit

      - name: Syntax validation
        run: |
          python -m compileall rl backend/app

      - name: Unit tests
        run: |
          pytest rl -q

      - name: Static security scan
        continue-on-error: true
        run: |
          bandit -r rl backend/app -ll

      - name: Dependency security audit
        continue-on-error: true
        run: |
          pip-audit

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Traffic MARL API image
        run: |
          docker build -t traffic-marl-api:ci ./backend

      - name: Validate Docker Compose
        run: |
          docker compose config
