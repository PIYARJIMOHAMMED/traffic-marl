name: Traffic MARL CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # ============================================================
  # TEST AND SECURITY
  # ============================================================
  test:
    name: Test and Security
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ----------------------------------------------------------
      # Install project dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Backend dependencies
          python -m pip install -r backend/requirements.txt

          # SUMO / TraCI dependencies required by RL tests
          python -m pip install traci==1.27.1 sumolib

          # Testing and security tools
          python -m pip install pytest bandit pip-audit

      # ----------------------------------------------------------
      # Verify critical SUMO dependency
      # ----------------------------------------------------------
      - name: Verify TraCI installation
        run: |
          python -c "import traci; print('TraCI OK:', traci.__version__)"
          python -c "import sumolib; print('sumolib OK')"

      # ----------------------------------------------------------
      # Python syntax validation
      # ----------------------------------------------------------
      - name: Syntax validation
        run: |
          python -m compileall rl backend/app

      # ----------------------------------------------------------
      # Unit tests
      # ----------------------------------------------------------
      - name: Unit tests
        run: |
          python -m pytest rl -q

      # ----------------------------------------------------------
      # Static security scan
      # ----------------------------------------------------------
      - name: Static security scan
        continue-on-error: true
        run: |
          bandit -r rl backend/app -ll

      # ----------------------------------------------------------
      # Dependency security audit
      # ----------------------------------------------------------
      - name: Dependency security audit
        continue-on-error: true
        run: |
          pip-audit


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Build backend Docker image
      # ----------------------------------------------------------
      - name: Build Traffic MARL API image
        run: |
          docker build -t traffic-marl-api:ci ./backend

      # ----------------------------------------------------------
      # Validate Docker Compose
      # ----------------------------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config