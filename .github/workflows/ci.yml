name: Traffic MARL CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:

  test:
    name: Test and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools
          sumo --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt
          python -m pip install pytest bandit pip-audit
          python -m pip install traci==1.27.1 sumolib

      - name: Verify TraCI and SUMO
        run: |
          python -c "import traci; print('TraCI OK:', traci.__version__)"
          python -c "import sumolib; print('sumolib OK')"
          sumo --version

      - name: Syntax validation
        run: |
          python -m compileall rl backend/app

      - name: Unit tests
        run: |
          python -m pytest rl -q

      - name: Static security scan
        continue-on-error: true
        run: |
          bandit -r rl backend/app -ll

      - name: Dependency security audit
        continue-on-error: true
        run: |
          pip-audit


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Traffic MARL API image
        run: |
          docker build -t traffic-marl-api:ci ./backend

      - name: Create temporary environment file
        run: |
          touch backend/.env

      - name: Validate Docker Compose
        run: |
          docker compose config