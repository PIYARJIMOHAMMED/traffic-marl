services:
  db:
    image: postgres:16
    container_name: traffic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: traffic_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mlflow:
    image: python:3.10-slim
    container_name: traffic_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db"
    volumes:
      - mlflow_data:/mlflow
      - ./mlruns:/mlruns
      - ./experiments:/experiments

volumes:
  postgres_data:
  mlflow_data:
