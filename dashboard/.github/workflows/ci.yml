name: MAI-07 CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest bandit pip-audit

      - name: Compile Python
        run: python -m compileall rl backend dashboard simulation

      - name: Run tests
        run: pytest -q

      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -f json -o pip-audit-report.json || pip-audit

      - name: Static security scan
        continue-on-error: true
        run: bandit -r rl backend dashboard simulation -ll -f json -o bandit-report.json || bandit -r rl backend dashboard simulation -ll

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mai07-security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t traffic-marl-api:ci ./backend

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config
